<!doctype html>
<html>
  <head>
    <script>
      // monkey-patch willReadFrequently
      const originalGetContext = HTMLCanvasElement.prototype.getContext;
      HTMLCanvasElement.prototype.getContext = function (type, attributes) {
        if (type === "2d") {
          attributes = { ...attributes, willReadFrequently: true };
        }
        return originalGetContext.call(this, type, attributes);
      };
    </script>
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    <!-- we import arjs version without NFT but with marker + location based support -->
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/aframe-extras@7.5.4/dist/aframe-extras.min.js"></script>
    <script>
      window.addEventListener("DOMContentLoaded", () => {
        const params = new URLSearchParams(window.location.search);
        const modelUrl = params.get("model");

        if (modelUrl) {
          const modelEl = document.querySelector("#model");
          const resolved = new URL(modelUrl, window.location.href).href;
          modelEl.setAttribute("gltf-model", resolved);
        }
      });
    </script>
  </head>

  <body style="margin: 0px; overflow: hidden">
    <a-scene embedded arjs>
      <a-marker preset="hiro">
        <a-entity
          id="model"
          position="0 0 3"
          scale="0.5 0.5 0.5"
          rotation="0 -90 90"
          gltf-model=""
          animation-mixer
        ></a-entity>
      </a-marker>
      <a-entity camera></a-entity>
    </a-scene>
  </body>
</html>
